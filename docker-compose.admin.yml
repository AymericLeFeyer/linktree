# Interface d'admin du linktree — image publiée sur GHCR par la même pipeline.
# À déployer comme stack Dockhand séparée (« linktree-admin »).
#
# Connexion par GitHub (device flow) : seuls les comptes ayant le droit
# d'écriture sur le dépôt peuvent modifier les liens, et les commits sont faits
# avec leur propre jeton. Rien d'autre à configurer que le Client ID (public) :
#   GITHUB_CLIENT_ID  Client ID d'une OAuth App GitHub, case « Enable Device
#                     Flow » cochée (github.com/settings/developers). Obligatoire.

services:
  linktree-admin:
    image: ghcr.io/aymericlefeyer/linktree-admin:latest
    container_name: aylabs-linktree-admin
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${LINKTREE_ADMIN_PORT:-8083}:8083"
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Client ID de l'OAuth App GitHub obligatoire}
      GITHUB_REPO: ${GITHUB_REPO:-AymericLeFeyer/linktree}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
